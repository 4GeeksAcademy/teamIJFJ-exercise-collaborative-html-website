<div class="container py-5" id="contact">
    <h2>Contact</h2>
    <p>Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper. Praesent
        commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.</p>
    <div class="bg-light p-4 mt-4 mx-auto" style="max-width: 800px;">
        <form>
            <div class="row mb-3">
                <label for="email" class="col-sm-3 col-form-label text-end">
                    <strong>Your E-mail</strong>
                </label>
                <div class="col-sm-9">
                    <input type="email" class="form-control" id="email" placeholder="Your email">
                </div>
            </div>

            <div class="row mb-3">
                <label for="message" class="col-sm-3 col-form-label text-end">
                    <strong>Your Message</strong>
                </label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="message" rows="4"
                        placeholder="Please enter your message here..."></textarea>
                </div>
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </div>
</div>
